name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by softprops/action-gh-release to create the auto-release on main pushes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/mapme-release.keystore

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        RELEASE_STORE_FILE: mapme-release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Build Release AAB (Play Store)
      run: ./gradlew bundleRelease --stacktrace
      env:
        RELEASE_STORE_FILE: mapme-release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Rename APKs
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mapme-mapper-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}-debug.apk
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/mapme-mapper-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}-release.apk 2>/dev/null || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: mapme-mapper-debug
        path: app/build/outputs/apk/debug/mapme-mapper-*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: mapme-mapper-release
        path: app/build/outputs/apk/release/mapme-mapper-*.apk
        retention-days: 90

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: mapme-mapper-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 90

    - name: Create Release (on push to main)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ steps.version.outputs.code }} (v${{ steps.version.outputs.name }})
        body: |
          Automatic build from commit ${{ github.sha }}

          **Changes:** ${{ github.event.head_commit.message }}

          Download the APK below and install on your Android device.
        files: |
          app/build/outputs/apk/debug/mapme-mapper-*.apk
          app/build/outputs/apk/release/mapme-mapper-*.apk
          app/build/outputs/bundle/release/*.aab
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
